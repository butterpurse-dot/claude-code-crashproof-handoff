# Copy to <MEM>/session-wrap.conf  (<MEM> = the memory dir; the README says how to print it)
#
# One project per line:  match|TAG|rules-file|now-file
#   match       text found in the project's path (or its main repo's path, for worktrees)
#   TAG         the project's tag in MEMORY.md: "READ FIRST FOR <TAG>"
#   rules-file  always-loaded rules, in <MEM>: owner rules and paid-for lessons
#   now-file    short current state and next steps, in <MEM>
#
# When a session starts inside a matching project, the hook prints the rules file
# and the now file in full, then only that project's handoff pointer.
# Keep both files short: hook context is cut at about 10,000 characters.

my-shop-app|SHOP|shop_rules.md|shop_now.md
